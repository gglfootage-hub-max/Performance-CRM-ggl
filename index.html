<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance CRM ggl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7A2BD6;
  --brand-deep:color-mix(in srgb,var(--brand) 55%,#12021f);
  --brand-hi:color-mix(in srgb,var(--brand) 65%,#ffffff);
  --accent:var(--brand); --accent-ink:#fff;
  --bg:color-mix(in srgb,var(--brand) 5%,#FFFFFF);
  --surface:#FFFFFF;
  --soft:color-mix(in srgb,var(--brand) 10%,#FFFFFF);
  --ink:#1F1433; --muted:#6F6388;
  --line:color-mix(in srgb,var(--brand) 14%,#FFFFFF);
  --track:color-mix(in srgb,var(--brand) 11%,#FFFFFF);
  --hit:#0FA97A; --near:#E08A00; --miss:#E43B72; --wait:#BDB3D3;
  --hit-soft:#D8F5EA; --near-soft:#FDEFD2; --miss-soft:#FDE1EB; --wait-soft:#F1EEF7;
  --display:"Mitr","Anuphan","Noto Sans Thai",Tahoma,sans-serif;
  --body:"Anuphan","Noto Sans Thai",Tahoma,sans-serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --accent:color-mix(in srgb,var(--brand) 55%,#fff); --accent-ink:#150a24;
    --bg:color-mix(in srgb,var(--brand) 10%,#0B0614);
    --surface:color-mix(in srgb,var(--brand) 15%,#130B20);
    --soft:color-mix(in srgb,var(--brand) 26%,#130B20);
    --ink:#F4EEFF; --muted:#AFA2C9;
    --line:color-mix(in srgb,var(--brand) 28%,#130B20);
    --track:color-mix(in srgb,var(--brand) 24%,#130B20);
    --hit:#2AD6A0; --near:#FFB83D; --miss:#FF6A9A; --wait:#5A4F74;
    --hit-soft:#10392E; --near-soft:#3C2C0E; --miss-soft:#40162B; --wait-soft:#241C36;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%;transition:grid-template-columns .25s ease}
body.sideHid .app{grid-template-columns:0 minmax(0,1fr)}
body.sideHid .side{visibility:hidden;padding:0;overflow:hidden}
.sideToggle{position:fixed;top:14px;left:14px;z-index:72;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:none;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(20,4,50,.14)}
.sideToggle svg{width:18px;height:18px}
body.sideHid .sideToggle{display:grid}
.sideClose{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.18);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.sideClose svg{width:14px;height:14px}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:linear-gradient(185deg,var(--brand) -40%,var(--brand-deep) 45%,color-mix(in srgb,var(--brand-deep) 70%,#000) 100%);color:#fff;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;padding:0 6px}
.logo svg{width:26px;height:26px}
.sl{font-size:12px;opacity:.7;margin:0 6px 6px;display:block}
.side select{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;color:#fff;font-family:var(--display);font-size:16px}
.side select option{color:#1F1433}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.22);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:#fff;border-radius:9px;padding:7px 0;cursor:pointer;font-weight:600;font-size:14px;opacity:.8}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-deep);opacity:1}
.wlist{display:flex;flex-direction:column;gap:4px}
.wbtn{display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;opacity:.85}
.wbtn b{font-family:var(--display);font-weight:500;font-size:15px}
.wbtn span{font-size:12.5px;opacity:.75}
.wbtn:hover{background:rgba(255,255,255,.08)}
.wbtn[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1;box-shadow:inset 3px 0 0 #fff}
.nav{display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:#fff;border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;font-size:15px;opacity:.85}
.nav button svg{width:19px;height:19px;flex:none;opacity:.9}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:#fff;color:var(--brand-deep);opacity:1;font-weight:600}
.nav .lock{margin-left:auto;font-size:11px;opacity:.7}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill i{width:8px;height:8px;border-radius:50%;background:#FFD66B;display:inline-block}
.pill.live i{background:#5CF2BE;box-shadow:0 0 0 4px rgba(92,242,190,.22)}
.pill.local i{background:#FFB0C8}
.who-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:#fff;text-decoration:underline;cursor:pointer;opacity:.85;font-size:13px;padding:0}

/* mini calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .h{font-size:11px;opacity:.65;padding-bottom:2px}
.cal button{border:0;border-radius:8px;padding:5px 0 7px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer;font-size:13px;position:relative;font-variant-numeric:tabular-nums}
.cal button:disabled{background:none;opacity:.3;cursor:default}
.cal button.today{box-shadow:inset 0 0 0 1.5px currentColor}
.cal button[aria-pressed="true"]{background:#fff;color:var(--brand-deep);font-weight:700}
.cal button.dot::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#5CF2BE}
.pcal .cal button{background:var(--soft)}
.pcal .cal button:disabled{background:none}
.pcal .cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pcal .cal button.dot::after{background:var(--hit)}

/* ---------- main ---------- */
.main{min-width:0;padding:26px clamp(16px,2.4vw,40px) 70px}
.notice{background:var(--near-soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px;border-left:6px solid var(--near)}
.notice b{display:block;font-family:var(--display);font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.6vw,36px);margin:0;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--muted)}
.sec{margin-bottom:34px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sech h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.sech p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* hero */
.hero{background:radial-gradient(130% 160% at 100% 0%,var(--brand) 0%,var(--brand-deep) 62%);color:#fff;border-radius:24px;padding:26px 30px 22px;margin-bottom:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -70% -10%;height:120%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 2px,transparent 2px 44px);transform:perspective(600px) rotateX(58deg);transform-origin:bottom;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hrow{display:grid;grid-template-columns:1fr auto;gap:16px 30px;align-items:end}
.hero .ttl{font-size:15px;opacity:.82}
.figs{display:flex;gap:30px;flex-wrap:wrap;margin-top:10px}
.fig small{display:block;font-size:13px;opacity:.78}
.fig strong{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.4vw,32px);line-height:1.15}
.bigpct{font-family:var(--display);font-weight:700;font-size:clamp(56px,7vw,100px);line-height:.9;text-align:right}
.bigpct small{display:block;font-family:var(--body);font-weight:500;font-size:14px;opacity:.82;margin-top:8px}
.htrack{margin-top:20px}

.track{position:relative;display:block;height:16px;border-radius:999px;background:var(--track)}
.hero .track{height:24px;background:rgba(255,255,255,.15)}
.fill{position:absolute;display:block;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hero .fill{background:linear-gradient(90deg,var(--brand-hi),#fff)}
.runner{position:absolute;display:block;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--accent));transition:left .8s cubic-bezier(.2,.8,.2,1)}
.hero .runner{width:32px;height:32px;margin:-16px 0 0 -16px;border:0;background:#fff;display:grid;place-items:center;color:var(--brand-deep);box-shadow:0 6px 18px rgba(20,4,50,.35)}
.hero .runner svg{width:19px;height:19px}
.pace{position:absolute;display:block;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink);opacity:.5}
.hero .pace{border-color:#fff;opacity:.9;top:-9px;bottom:-9px}
.hcap{display:flex;justify-content:space-between;font-size:12.5px;opacity:.78;margin-top:8px}
@media (prefers-reduced-motion:reduce){.fill,.runner{transition:none}}

/* avatar */
.av{flex:none;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:600;box-shadow:0 0 0 2px var(--c,var(--line))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
button.av{border:0;cursor:pointer;padding:0}

/* stars */
.stars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.star{padding:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.star:first-child{border-left:0}
.star .t{font-size:13.5px;color:var(--muted);font-weight:600}
.star .row{display:flex;align-items:center;gap:12px;min-width:0}
.star .row b{font-family:var(--display);font-weight:500;font-size:17px;display:block;line-height:1.25}
.star .row small{color:var(--muted);font-size:12.5px}
.star .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--accent)}
.star.none .v{color:var(--wait);font-size:17px}

/* lanes */
.lane{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr) 200px 150px;gap:20px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{font-family:var(--display);font-weight:500;font-size:17px;display:block;line-height:1.25}
.who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .nums{font-size:13.5px;color:var(--muted);line-height:1.35}
.lane .nums b{color:var(--ink);font-size:15.5px;font-weight:600}
.lane .need{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.lane .need b{display:block;color:var(--ink);font-size:15px}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;margin-top:3px}
.hit{--c:var(--hit)} .near{--c:var(--near)} .miss{--c:var(--miss)} .wait{--c:var(--wait)}
.chip.hit{background:var(--hit-soft);color:var(--hit)}
.chip.near{background:var(--near-soft);color:var(--near)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}
.chip.wait{background:var(--wait-soft);color:var(--muted)}

/* daily chart */
.chart{padding:18px 20px 10px}
.chart svg{width:100%;height:220px;display:block;overflow:visible}
.chart .lbl{font-size:11px;fill:var(--muted)}
.chart .tl{stroke:var(--ink);stroke-dasharray:5 5;opacity:.45}

/* funnel */
.funnelwrap{display:grid;grid-template-columns:1.3fr 1fr}
.funnel{padding:20px 22px;border-right:1px solid var(--line)}
.fstep{display:grid;grid-template-columns:86px 1fr 90px;gap:14px;align-items:center;margin-bottom:10px}
.fstep .l{font-weight:600;font-size:14.5px}
.fbar{height:32px;background:var(--track);border-radius:10px;position:relative;overflow:hidden}
.fbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--brand-deep),var(--brand));border-radius:10px}
.fbar em{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:600;font-size:13.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fstep .r{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.fstep .r b{display:block;color:var(--ink);font-size:15.5px}
.fside{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;align-content:start}
.fside small{display:block;color:var(--muted);font-size:12.5px}
.fside b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface);line-height:1.3;vertical-align:bottom}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.tl-left{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
td .tn{display:flex;align-items:center;gap:10px}
td small{color:var(--muted);font-weight:400}
td.up{color:var(--hit);font-weight:600}
td.down{color:var(--miss);font-weight:600}
td.na{color:var(--wait)}
.cell{display:inline-flex;flex-direction:column;align-items:center;min-width:86px;padding:4px 8px;border-radius:9px;font-weight:600;line-height:1.25}
.cell small{font-weight:400;font-size:11.5px;opacity:.85}
.cell.hit{background:var(--hit-soft);color:var(--hit)}
.cell.near{background:var(--near-soft);color:var(--near)}
.cell.miss{background:var(--miss-soft);color:var(--miss)}
.cell.wait{color:var(--wait)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:12px;font-weight:700;color:var(--accent);margin-right:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* entry */
.entryhead{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-bottom:20px}
.ehcard{padding:18px 20px}
.teampick{display:flex;align-items:center;gap:16px;margin-top:14px}
.teampick .av{width:64px;height:64px;font-size:26px}
.teampick h3{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.2}
.teampick p{margin:2px 0 0;color:var(--muted);font-size:14px}
.etable td{padding:7px 8px}
.ein{width:100%;min-width:84px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.ein.wide{min-width:120px}
.ein:focus{border-color:var(--accent);outline:none}
.ein.bad{border-color:var(--miss);background:var(--miss-soft)}
.notes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:18px 20px}
label.l{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
textarea{width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 10px 30px rgba(30,10,60,.15);margin-top:18px;z-index:3;flex-wrap:wrap}
.savebar .msg{color:var(--muted);font-size:14px}
.savebar .msg.dirty{color:var(--near);font-weight:600}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--miss-soft);color:var(--miss)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--muted);font-size:14px;margin:0;padding:18px 20px}

/* voices */
.voices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.col{padding:18px 20px}
.col h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.col h3 i{width:10px;height:10px;border-radius:50%}
.note{display:flex;gap:10px;padding:11px 0;border-top:1px dashed var(--line)}
.note:first-of-type{border-top:0;padding-top:0}
.note b{font-weight:600;font-size:14px}
.note p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{color:var(--muted);font-size:12px}

/* admin */
.form{padding:18px 20px}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.frow>div{min-width:140px}
.in{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--bg);width:100%}
.in:focus{border-color:var(--accent);outline:none}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.hol{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hol span{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px}
.hol button{border:0;background:var(--surface);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.atable td{padding:6px 8px}
.atable .in{min-width:110px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.err{color:var(--miss);font-size:14px;margin:8px 0 0}

dialog{border:0;padding:0;border-radius:22px;width:min(420px,calc(100vw - 20px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(20,4,50,.4)}
dialog::backdrop{background:rgba(20,8,36,.6)}
.dbody{padding:22px 24px}
.dbody h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 4px}
.dbody p{color:var(--muted);font-size:14px;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .25s;z-index:20}
.toast.show{transform:translate(-50%,0)}

@media (max-width:1280px){
  .stars{grid-template-columns:repeat(2,minmax(0,1fr))}

}

  .funnelwrap{grid-template-columns:1fr}

  .voices{grid-template-columns:1fr}

}

  .fstep{grid-template-columns:70px 1fr 74px;gap:10px}

/* bell & notifications */
.bell{position:fixed;top:14px;right:18px;z-index:70;display:flex;align-items:center;gap:6px;transition:transform .25s ease}
.bell.hid{transform:translateX(calc(100% - 26px))}
.bell.hid .bellbtn{opacity:.35;pointer-events:none}
.bellhide{width:20px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.bellhide svg{width:13px;height:13px;transition:transform .25s}

.bellbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(20,4,50,.14);position:relative}

.nitem+.nitem{border-top:1px solid var(--line)}
.nitem .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--soft);font-size:16px}
.nitem b{font-size:13.5px}
.nitem small{display:block;color:var(--muted);margin-top:2px;line-height:1.5}
.nitem.warn .ic{background:#FEF0C7}.nitem.bad .ic{background:#FEE4E2}.nitem.good .ic{background:#D1FADF}
.figs .fig strong{font-size:clamp(19px,2vw,28px);letter-spacing:-.3px}
.kpigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:22px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.khead{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.khead small{display:block;color:var(--muted);font-size:12px}
.kbig{font-size:25px;font-weight:700;margin:2px 0 2px}
.kbig small{font-size:13px;font-weight:500;color:var(--muted)}
.ksub{font-size:12px;color:var(--muted);margin-bottom:8px}
.krow{display:grid;grid-template-columns:92px 1fr 118px;gap:9px;align-items:center;padding:5px 0}
.krow .kl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.krow .kbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden}

.kdetails summary{cursor:pointer;color:var(--brand-deep);font-weight:600;padding:4px 0}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.sumtile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow,0 1px 2px rgba(20,4,50,.06))}

.note .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

<script>
/* ============ boot ============ */
const BOOT = window.APP_CONFIG || {};
const API = String(BOOT.apiUrl || "").trim();
const CODE_KEY = "salesRace.code";
const NUMF = ["newSales", "newOrders", "oldSales", "oldOrders", "sales", "calls", "reached", "completed", "closed", "talk", "newCust"];
const STATUS_TXT = { hit: "ถึงเป้า", near: "ใกล้เป้า", miss: "ต่ำกว่าเป้า", wait: "รอกรอก" };
const POLL_MS = 30000;
const ICON = {
  dash: '<path d="M3 13h8V3H3z"/><path d="M13 21h8V11h-8z"/><path d="M13 3v6h8V3z"/><path d="M3 21h8v-6H3z"/>',
  entry: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  hit: '<path d="M12 2l2.9 6.26 6.9 1.01-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.9-1.01z"/>',
  inc: '<circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3L8.5 13"/>',
  catchup: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  lists: '<circle cx="6" cy="5" r="2.6"/><circle cx="18" cy="5" r="2.6"/><circle cx="12" cy="19" r="2.6"/><path d="M7.2 7.4 10.8 16.6M16.8 7.4 13.2 16.6"/>',
  people: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21a6 6 0 0 0-4-5.6"/>',
  kpi: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
  summary: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/><path d="M9 4v17"/>',
  voices: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  admin: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const PAGES = [
  ["dash", "ภาพรวม"], ["entry", "กรอกผลรายวัน"], ["lists", "กระจายรายชื่อ"], ["catchup", "แผนเป้าทบ"], ["inc", "Incentive"], ["hit", "Daily Sales Tracking"], ["people", "รายคน"], ["kpi", "KPI รายทีม"],
  ["summary", "สรุปตามช่วงเวลา"], ["voices", "เสียงจากซุป"], ["admin", "ตั้งค่า (แอดมิน)"]
];

const S = {
  month: null, months: [], cfg: null, cal: null, role: null,
  daily: {}, notes: {}, photos: {},
  page: "dash", ptype: "day", week: 0, day: null,
  entryTeam: null, entryDate: null, dirty: false,
  peopleTeam: "all", planTeam: null, cuTeam: null, listsTeam: null, replyKey: null, sort: { k: "p", d: -1 }, sumMode: "team",
  draft: null, mode: "connecting"
};
let code = ""; try { code = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}

/* ============ utils ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { if (v === null || v === undefined || v === "") return null; const n = Number(v); return isFinite(n) ? n : null; };
const fmt = n => n == null || !isFinite(n) ? "—" : Math.round(n).toLocaleString("th-TH");
const fmt1 = n => n == null || !isFinite(n) ? "—" : n.toLocaleString("th-TH", { maximumFractionDigits: 1 });
const fmtM = n => fmt(n); // แสดงตัวเลขเต็มพร้อมคอมมา ไม่ย่อเป็นล้าน
const pct = p => p == null || !isFinite(p) ? "—" : (p * 100).toLocaleString("th-TH", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const hm = h => { if (h == null || !isFinite(h)) return "—"; const m = Math.round(h * 60); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };
const isHex = v => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);
const isImg = v => typeof v === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v);
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function parseNum(v) { const c = String(v ?? "").replace(/[,\s฿]/g, ""); if (c === "") return null; const n = Number(c); return isFinite(n) && n >= 0 ? n : NaN; }
function parseTalk(v) {
  const c = String(v ?? "").trim(); if (c === "") return null;
  const m = c.match(/^(\d+):(\d{1,2})$/);
  if (m) { const mm = +m[2]; return mm < 60 ? +m[1] + mm / 60 : NaN; }
  const n = Number(c.replace(/,/g, "")); return isFinite(n) && n >= 0 ? n : NaN;
}
const pad = n => String(n).padStart(2, "0");
function todayStr() { const t = new Date(); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); }
function dsDate(ds) { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d); }
const thMonth = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("th-TH", { month: "long", year: "numeric" }); };
const dShort = ds => dsDate(ds).toLocaleDateString("th-TH", { day: "numeric", month: "short" });
const dLong = ds => dsDate(ds).toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

/* ============ config & calendar ============ */
function bootMonth() {
  const w = BOOT.weeks && BOOT.weeks[0] && BOOT.weeks[0].end;
  if (w) return w.slice(0, 7);
  return todayStr().slice(0, 7);
}
function defaultConfig(month) {
  return {
    month, brand: isHex(BOOT.brand) ? BOOT.brand : "#7A2BD6", near: 0.9, hit: 1,
    workWeekdays: [1, 2, 3, 4, 5, 6],
    holidays: month === "2026-10" ? ["2026-10-13", "2026-10-23"] : [],
    teams: (BOOT.teams || []).map(t => ({ id: t.id, name: t.name, sup: "", target: t.target })),
    people: [],
    kpi: { callsPerDay: null, talkPerDay: null, rReach: null, rCon: null }
  };
}
function normCfg(c, month) {
  const d = defaultConfig(month);
  c = Object.assign({}, d, c || {});
  c.month = month;
  c.teams = Array.isArray(c.teams) ? c.teams : [];
  c.people = Array.isArray(c.people) ? c.people : [];
  c.holidays = Array.isArray(c.holidays) ? c.holidays : [];
  c.workWeekdays = Array.isArray(c.workWeekdays) ? c.workWeekdays : d.workWeekdays;
  c.kpi = Object.assign({}, d.kpi, c.kpi || {});
  c.campaigns = Array.isArray(c.campaigns) ? c.campaigns : [];
  c.events = Array.isArray(c.events) ? c.events : [];
  c.inc = Object.assign({ first: 500 }, c.inc || {});
  c.inc.tiers = Array.isArray(c.inc.tiers) && c.inc.tiers.length ? c.inc.tiers.map(t => [num(t[0]) || 0, num(t[1]) || 0]) : [[350000, 2000], [400000, 2500], [500000, 3500], [600000, 4000], [700000, 5000]];
  c.prob = Object.assign({ days: 30, target: 60000, wage: 400 }, c.prob || {});
  c.pbi = Object.assign({ url: "" }, c.pbi || {});
  c.hitboard = Object.assign({ url: "https://docs.google.com/spreadsheets/d/1DvKYyhEge8TF-PQA7daiO4kf63hIqbd-XVohckiOZds/edit?gid=1447612684#gid=1447612684" }, c.hitboard || {});
  c.replies = c.replies && typeof c.replies === "object" ? c.replies : {};
  c.approvals = c.approvals && typeof c.approvals === "object" ? c.approvals : {};
  return c;
}
function calendar(cfg) {
  const [y, m] = cfg.month.split("-").map(Number);
  const n = new Date(y, m, 0).getDate();
  const hol = new Set(cfg.holidays), ww = new Set(cfg.workWeekdays.map(Number));
  const days = [];
  for (let d = 1; d <= n; d++) {
    const ds = `${y}-${pad(m)}-${pad(d)}`, dow = new Date(y, m - 1, d).getDay();
    days.push({ ds, d, dow, work: ww.has(dow) && !hol.has(ds) });
  }
  const work = days.filter(x => x.work).map(x => x.ds);
  const off = (days[0].dow + 6) % 7, groups = {};
  days.forEach(x => { const k = Math.floor((x.d - 1 + off) / 7); (groups[k] = groups[k] || []).push(x); });
  const weeks = [];
  Object.keys(groups).sort((a, b) => a - b).forEach(k => {
    const wd = groups[k].filter(x => x.work);
    if (!wd.length) return;
    const a = wd[0], b = wd[wd.length - 1];
    const mon = dsDate(a.ds).toLocaleDateString("th-TH", { month: "short" });
    weeks.push({ id: "W" + (weeks.length + 1), days: wd.map(x => x.ds), label: a.d === b.d ? `${a.d} ${mon}` : `${a.d}–${b.d} ${mon}` });
  });
  return { days, work, weeks, total: work.length };
}
function weekOf(ds) { return Math.max(0, S.cal.weeks.findIndex(w => w.days.includes(ds) || w.days[w.days.length - 1] >= ds)); }
function defaultDay() {
  const t = todayStr(), w = S.cal.work;
  if (!w.length) return S.cal.days[0].ds;
  if (w.includes(t)) return t;
  const past = w.filter(d => d <= t);
  return past.length ? past[past.length - 1] : w[0];
}

/* ============ targets & aggregation ============ */
const teamById = id => S.cfg.teams.find(t => t.id === id);
const personById = id => S.cfg.people.find(p => p.id === id);
function personTargets() {
  const out = {};
  S.cfg.teams.forEach(t => {
    const ps = S.cfg.people.filter(p => p.team === t.id && p.active !== false);
    const fixed = ps.filter(p => num(p.target) > 0), rest = ps.filter(p => !(num(p.target) > 0));
    const used = fixed.reduce((s, p) => s + num(p.target), 0);
    fixed.forEach(p => out[p.id] = num(p.target));
    rest.forEach(p => out[p.id] = rest.length ? Math.max(0, (num(t.target) || 0) - used) / rest.length : 0);
  });
  S.cfg.people.forEach(p => { if (out[p.id] === undefined) out[p.id] = num(p.target) || 0; });
  return out;
}
function agg(days, pred) {
  const set = new Set(days);
  const a = { n: 0, pdays: 0, pdCalls: 0, pdTalk: 0, dates: new Set() };
  const has = {};
  NUMF.forEach(f => { a[f] = 0; has[f] = false; });
  for (const r of Object.values(S.daily)) {
    if (!set.has(r.date) || !pred(r)) continue;
    let any = false;
    NUMF.forEach(f => { const v = num(r[f]); if (v !== null) { a[f] += v; has[f] = true; any = true; } });
    if (!any) continue;

  a.rDone = a.reached ? d(a.completed, a.reached) : null;

  a.rConNew = a.newCust ? d(a.newOrders, a.newCust) : null;
  const oldDone = a.completed != null && a.newCust != null ? Math.max(0, a.completed - a.newCust) : a.completed;

  a.talkPer = a.talk != null ? d(a.talk, a.pdTalk) : null;
  a.callsPer = a.calls != null ? d(a.calls, a.pdCalls) : null;
  a.aov = a.closed ? d(a.sales, a.closed) : null;

}

function planCalc(plan) {
  const rows = (Array.isArray(plan) ? plan : []).map(x => {
    const list = num(x && x[0]) || 0, aov = num(x && x[1]) || 0, con = num(x && x[2]) || 0;
    const orders = list * con; return { list, aov, con, orders, sales: orders * aov };
  });
  const t = rows.reduce((a, r) => ({ list: a.list + r.list, orders: a.orders + r.orders, sales: a.sales + r.sales }), { list: 0, orders: 0, sales: 0 });
  return { rows, ...t };
}

function incCalc() {
  const tiers = ((S.cfg.inc || {}).tiers || []).slice().sort((a, b) => (num(a[0]) || 0) - (num(b[0]) || 0));
  const firstB = num((S.cfg.inc || {}).first) || 0;
  const byP = {};
  Object.values(S.daily).forEach(r => { (byP[r.person] = byP[r.person] || []).push(r); });
  const people = S.cfg.people.filter(p => p.active !== false).map(p => {
    const rs = (byP[p.id] || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
    let cum = 0; const crossed = tiers.map(() => null);
    rs.forEach(r => { cum += num(r.sales) || 0; tiers.forEach((t, i) => { if (crossed[i] === null && cum >= (num(t[0]) || Infinity)) crossed[i] = r.date; }); });
    const tier = crossed.reduce((a, d, i) => d != null ? i : a, -1);
    return { p, sales: cum, tier, crossed, reward: tier >= 0 ? num(tiers[tier][1]) || 0 : 0 };
  });
  const firsts = tiers.map((t, i) => {
    const c = people.filter(x => x.crossed[i]).sort((a, b) => a.crossed[i] < b.crossed[i] ? -1 : 1);
    if (!c.length) return null;
    const d = c[0].crossed[i]; return { date: d, winners: c.filter(x => x.crossed[i] === d) };
  });
  people.forEach(x => { x.firstBonus = firsts.reduce((sm, f) => sm + (f && f.winners.includes(x) ? firstB : 0), 0); x.total = x.reward + x.firstBonus; });
  return { tiers, firstB, people: people.sort((a, b) => b.sales - a.sales || b.total - a.total), firsts };
}
function addDays(ds, n) { const d = dsDate(ds); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function probInfo(p) {
  const pr = S.cfg.prob || {}, start = p.probStart || S.month + "-01";
  const nd = num(pr.days) || 30, end = addDays(start, nd - 1), t = todayStr();
  let sales = 0;
  for (const r of Object.values(S.daily)) if (r.person === p.id && r.date >= start && r.date <= end) sales += num(r.sales) || 0;
  const target = num(pr.target) || 60000;
  const daysLeft = t >= end ? 0 : Math.round((dsDate(end) - dsDate(t)) / 864e5);
  return { start, end, sales, target, wage: num(pr.wage) || 0, pass: sales >= target, over: t > end, daysLeft };
}
function notifItems() {
  const items = [], t = todayStr(), pt = personTargets();
  const dayN = ds => Math.round((dsDate(ds) - dsDate(t)) / 864e5);

  });
  S.cfg.people.filter(p => p.active !== false && p.status === "prob").forEach(p => {
    const pi = probInfo(p);
    if (pi.pass) items.push({ cls: "good", ic: "🎉", b: `${p.name} ผ่านทดลองงานแล้ว`, s: `ทำได้ ${fmt(pi.sales)} / ${fmt(pi.target)} บาท (ครบกำหนด ${dShort(pi.end)})` });
    else if (pi.over) items.push({ cls: "bad", ic: "⚠️", b: `${p.name} ครบทดลองงาน ยอดไม่ถึงเกณฑ์`, s: `ทำได้ ${fmt(pi.sales)} / ${fmt(pi.target)} บาท · ครบกำหนดเมื่อ ${dShort(pi.end)}` });
    else if (pi.daysLeft <= 7) items.push({ cls: "warn", ic: "⏳", b: `${p.name} เหลือทดลองงาน ${pi.daysLeft} วัน`, s: `ทำได้ ${fmt(pi.sales)} / ${fmt(pi.target)} บาท · ขาดอีก ${fmt(Math.max(0, pi.target - pi.sales))} บาท` });
  });
  const elapsed = S.cal.work.filter(d => d <= t).length, totalW = S.cal.total || 1, left = S.cal.work.filter(d => d > t).length;
  const I = incCalc(), got = I.people.filter(x => x.total > 0);
  got.slice(0, 8).forEach(x => items.push({ cls: "good", ic: "🏆", b: `${x.p.name} ถึง Incentive ระดับ ${x.tier + 1}`, s: `ยอด ${fmt(x.sales)} บาท · รับ ${fmt(x.reward)}${x.firstBonus ? ` + คนแรก ${fmt(x.firstBonus)}` : ""} บาท` }));
  if (got.length > 8) items.push({ cls: "good", ic: "🏆", b: `และอีก ${got.length - 8} คนถึงเกณฑ์ Incentive`, s: `ดูทั้งหมดที่หน้า Incentive · รวมจ่ายเดือนนี้ ${fmt(got.reduce((sm, x) => sm + x.total, 0))} บาท` });

function chartHtml(P) {

    const X = x0 + i * (bw + gap), v = x.v || 0, st = !x.n ? "wait" : statusOf(v / daily, true);
    const h = Math.max(x.n ? 3 : 0, H - y(v));

    return `<g><title>${dShort(x.ds)}: ${fmt(v)} บาท (${x.n ? pct(v / daily) : "ยังไม่กรอก"})</title>

      <text class="lbl" x="${X + bw / 2}" y="${H + 16}" text-anchor="middle">${dsDate(x.ds).getDate()}</text></g>`;

  return `<section class="sec"><div class="sech"><div><h2>ยอดขายรายวันทั้งทีม</h2><p>เส้นประคือเป้ารายวัน ${fmt(daily)} บาท ชี้ที่แท่งเพื่อดูตัวเลข</p></div>

}

function funnelHtml(P) {
  const k = agg(P.days, allPred);
  const steps = [["โทรออก", k.calls, null, ""], ["ได้คุย", k.reached, k.rReach, "ติดต่อได้"], ["คุยจบ", k.completed, k.rDone, "คุยจบ"], ["จำนวนออเดอร์", k.closed, k.rCon, "%Con"]];
  const max = k.calls || Math.max(...steps.map(s => s[1] || 0)) || 1;
  const fun = steps.map(([l, v, r, rl]) => { const w = v ? Math.max(4, Math.min(100, v / max * 100)) : 0; return `<div class="fstep"><span class="l">${l}</span><span class="fbar"><i style="width:${w}%"></i><em class="num" ${w < 18 ? `style="left:calc(${w}% + 8px);color:var(--ink);text-shadow:none"` : ""}>${v == null ? "" : fmt(v)}</em></span><span class="r num">${r == null ? "" : `<b>${pct(r)}</b>${rl}`}</span></div>`; }).join("");
  const side = [["%Con ทั้งทีม", pct(k.rCon)], ["Talktime รวม", k.talk == null ? "—" : hm(k.talk) + " ชม."], ["Talktime / คน / วัน", k.talkPer == null ? "—" : hm(k.talkPer) + " ชม."], ["โทร / คน / วัน", k.callsPer == null ? "—" : fmt1(k.callsPer) + " สาย"], ["ยอดเฉลี่ยต่อออเดอร์", fmt(k.aov)], ["ลูกค้าใหม่", fmt(k.newCust)]]
    .map(([a, b]) => `<div><small>${a}</small><b class="num">${b}</b></div>`).join("");
  return `<section class="sec"><div class="sech"><div><h2>Funnel การโทรทั้งทีม</h2><p>จากสายที่โทรออกจนถึงออเดอร์ที่ปิดได้</p></div></div>
    <div class="panel funnelwrap"><div class="funnel">${fun}${k.calls == null ? '<p class="empty" style="padding:6px 0 0">ยังไม่มีข้อมูลการโทรในช่วงนี้</p>' : ""}</div><div class="fside">${side}</div></div></section>`;
}

function entryCalc() {
  const tr = $("etotal"); if (!tr) return;
  const sum = {}; NUMF.forEach(f => sum[f] = null);
  document.querySelectorAll("tr[data-row]").forEach(row => {
    const pid = row.dataset.row, v = {};
    row.querySelectorAll(".ein").forEach(i => {
      const x = i.dataset.f === "talk" ? parseTalk(i.value) : parseNum(i.value);
      i.classList.toggle("bad", Number.isNaN(x));
      v[i.dataset.f] = Number.isNaN(x) ? null : x;
      if (v[i.dataset.f] != null) sum[i.dataset.f] = (sum[i.dataset.f] || 0) + v[i.dataset.f];
    });
    const hasSplit = ["newSales", "oldSales", "newOrders", "oldOrders"].some(f => v[f] != null);
    if (hasSplit) {
      v.sales = (v.newSales || 0) + (v.oldSales || 0); v.closed = (v.newOrders || 0) + (v.oldOrders || 0);
      const si = row.querySelector('[data-f="sales"]'), ci = row.querySelector('[data-f="closed"]');
      si.value = v.sales.toLocaleString("th-TH"); ci.value = v.closed.toLocaleString("th-TH");
      sum.sales = (sum.sales || 0) + v.sales; sum.closed = (sum.closed || 0) + v.closed;
    }
    row.querySelector(`[data-calc]`).textContent = v.newCust ? pct((v.newOrders || 0) / v.newCust) : "—";
    const od = v.completed != null ? Math.max(0, v.completed - (v.newCust || 0)) : null;
    row.querySelector(`[data-calcold]`).textContent = od ? pct((v.oldOrders || 0) / od) : "—";
  });
  const t = teamById(S.entryTeam), dt = (num(t.target) || 0) / (S.cal.total || 1);
  const odT = sum.completed != null ? Math.max(0, sum.completed - (sum.newCust || 0)) : null;
  tr.innerHTML = `<td>รวมทีม ${sum.sales != null && dt ? `<small>(${pct(sum.sales / dt)} ของเป้าวัน)</small>` : ""}</td>` +
    ["newSales", "newOrders", "oldSales", "oldOrders", "sales", "closed", "calls", "reached", "completed"].map(f => `<td class="num">${fmt(sum[f])}</td>`).join("") +
    `<td class="num">${sum.talk == null ? "—" : hm(sum.talk)}</td><td class="num">${fmt(sum.newCust)}</td><td class="num">${sum.newCust ? pct((sum.newOrders || 0) / sum.newCust) : "—"}</td><td class="num">${odT ? pct((sum.oldOrders || 0) / odT) : "—"}</td>`;
}
async function saveEntry() {
  const ds = S.entryDate, t = teamById(S.entryTeam), wk = S.cal.weeks[weekOf(ds)];
  const rows = []; let bad = null;
  document.querySelectorAll("tr[data-row]").forEach(row => {
    const o = { person: row.dataset.row };
    row.querySelectorAll(".ein").forEach(i => {
      const x = i.dataset.f === "talk" ? parseTalk(i.value) : parseNum(i.value);
      if (Number.isNaN(x)) bad = bad || i;
      o[i.dataset.f] = Number.isNaN(x) ? null : x;
    });
    rows.push(o);
  });
  if (bad) { bad.focus(); toast("มีช่องที่กรอกไม่ใช่ตัวเลข (ช่องสีชมพู)"); return; }
  const noteBody = {}; let noteChanged = false;
  const old = S.notes[`${S.month}__${wk.id}__${t.id}`] || {};
  document.querySelectorAll("[data-note]").forEach(x => { noteBody[x.dataset.note] = x.value.trim(); if ((old[x.dataset.note] || "") !== noteBody[x.dataset.note]) noteChanged = true; });
  const btn = $("saveEntry"); btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  try {
    const by = S.role === "admin" ? "แอดมิน" : (t.sup || "ซุป");
    await apiWrite({ action: "saveDaily", month: S.month, date: ds, team: t.id, rows, by });
    if (noteChanged) await apiWrite({ action: "saveNotes", month: S.month, week: wk.id, team: t.id, ...noteBody, by });
    S.dirty = false;
    toast(`บันทึกผลทีม ${t.name} วันที่ ${dShort(ds)} แล้ว`);
    await load(S.month, true);
  } catch (e) { toast(errText(e)); }
  finally { const b = $("saveEntry"); if (b) { b.disabled = false; b.textContent = `บันทึกผลวันที่ ${dShort(ds)}`; } }
}

/* ---------- Daily Sales Tracking (อ่านจาก Google Sheet) ---------- */
let hitState = { loading: false, at: 0, table: null, err: null };
function hitSrc_() {
  const raw = ((S.cfg.hitboard || {}).url || "").trim();
  if (!raw) return null;
  const m = raw.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/), g = raw.match(/[#?&]gid=(\d+)/);
  return { raw, id: m ? m[1] : null, gid: g ? g[1] : null };
}
async function loadHit(force) {
  const src = hitSrc_(); if (!src || !src.id || hitState.loading) return;
  if (!force && Date.now() - hitState.at < 55000 && hitState.table) return;
  hitState.loading = true;
  try {
    const u = `https://docs.google.com/spreadsheets/d/${src.id}/gviz/tq?tqx=out:json&headers=1${src.gid ? `&gid=${src.gid}` : ""}&ts=${Date.now()}`;
    const txt = await (await fetch(u)).text();
    const j = JSON.parse(txt.slice(txt.indexOf("(") + 1, txt.lastIndexOf(")")));
    if (!j.table) throw new Error("no table");
    hitState = { loading: false, at: Date.now(), table: j.table, err: null };
  } catch (e) { hitState = { loading: false, at: Date.now(), table: hitState.table, err: e }; }
  if (S.page === "hit") renderHitBody();
}
function hitParse_() {
  const t = hitState.table; if (!t) return null;
  const labels = (t.cols || []).map(c => String(c.label || ""));
  const ix = name => labels.findIndex(l => l.replace(/\s+/g, "").toLowerCase().includes(name));
  const C = { crm: ix("crm"), total: ix("totalcrm"), target: ix("targetcrm"), actual: ix("actualcrm"), diff: ix("diff"), ach: ix("achieve"), order: ix("ordercrm"), size: ix("sizecrm"), calls: ix("โทรออก"), reached: ix("ได้คุย"), done: ix("คุยจบ"), talk: ix("talktime"), con: ix("con%"), manday: ix("manday"), avg: ix("เฉลี่ยเวลา") };
  if (C.crm < 0 || C.actual < 0) return null;
  const val = (r, i) => i >= 0 && r.c && r.c[i] ? r.c[i] : null;
  const numv = c => c && typeof c.v === "number" ? c.v : null;
  const disp = c => c ? (c.f != null ? String(c.f) : c.v == null ? "" : String(c.v)) : "";
  const groups = []; let cur = null, gkey = "";
  (t.rows || []).forEach(r => {
    const cells = (r.c || []).map(c => c ? (c.f != null ? String(c.f) : c.v == null ? "" : String(c.v)) : "");
    const joined = cells.join(" ");
    const crm = disp(val(r, C.crm)).trim();
    const firstTxt = cells.find(x => x.trim()) || "";
    if (/^total/i.test(firstTxt.trim()) || /^total/i.test(crm)) {
      if (cur) { cur.name = firstTxt.replace(/^total\s*/i, "").trim() || cur.name; cur.total = r; }
      return;
    }
    const grpCell = cells[0] && cells[0].trim();
    if (grpCell && !crm) { gkey = grpCell; return; }
    if (grpCell && grpCell !== gkey && crm) { gkey = grpCell; cur = null; }
    if (!crm) return;
    if (!cur || cur.key !== gkey) { cur = { key: gkey || "ทีม", name: gkey || "ทีม", rows: [], total: null }; groups.push(cur); }
    cur.rows.push(r);
  });
  return { C, groups, val, numv, disp };
}
function pageHit() {
  const src = hitSrc_();
  const head = `<div class="ph"><div><h1>Daily Sales Tracking</h1><p>ข้อมูลสดจากชีต Daily Sales Tracking อัปเดตอัตโนมัติทุก 1 นาที${S.role === "admin" ? ` · เปลี่ยนลิงก์ได้ที่ <a href="#" data-goto="admin">หน้าตั้งค่า</a>` : ""}</p></div></div>`;
  if (!src) return head + `<div class="panel"><p class="empty">ยังไม่ได้ใส่ลิงก์ชีต ${S.role === "admin" ? "ใส่ได้ที่หน้าตั้งค่า" : "รอแอดมินตั้งค่า"}</p></div>`;
  setTimeout(() => loadHit(false), 0);
  return head + `<div id="hitBody">${hitState.table ? "" : '<div class="panel"><p class="empty">กำลังโหลดข้อมูลจาก Google Sheet…</p></div>'}</div>`;
}
function renderHitBody() {
  const el = $("hitBody"); if (!el) return;
  const src = hitSrc_(), P = hitParse_();
  if (!P) {
    el.innerHTML = `<div class="panel" style="padding:0;overflow:hidden"><iframe src="https://docs.google.com/spreadsheets/d/${esc(src.id)}/preview?rm=minimal${src.gid ? `&gid=${src.gid}` : ""}#gid=${esc(src.gid || "0")}" title="Daily Sales Tracking" style="display:block;width:100%;height:min(78vh,900px);border:0"></iframe></div>
      <p class="hint" style="margin-top:10px">อ่านข้อมูลตรงไม่ได้ เลยแสดงชีตแทน · ให้เจ้าของชีตตั้งแชร์ "ทุกคนที่มีลิงก์ - ผู้มีสิทธิ์ดู" แล้วหน้านี้จะเปลี่ยนเป็นตารางสวยอัตโนมัติ · <a href="${esc(src.raw)}" target="_blank" rel="noopener">เปิดชีตเต็มจอ</a></p>`;

  const { C, groups, val, numv, disp } = P;
  const byUser = {}; S.cfg.people.forEach(p => { if (p.username) byUser[String(p.username).trim().toLowerCase()] = p; });
  const sum = i => groups.reduce((a, g) => a + g.rows.reduce((x, r) => x + (numv(val(r, i)) || 0), 0), 0);
  const actAll = sum(C.actual), tgtAll = sum(C.target), ordAll = sum(C.order), manAll = sum(C.manday);
  const tile = (t, v, sub) => `<div class="sumtile"><small>${t}</small><strong class="num">${v}</strong><span class="num">${sub || ""}</span></div>`;
  const achChip = v => v == null ? "" : `<span class="chip ${v >= (num(S.cfg.hit) || 1) ? "hit" : v >= (num(S.cfg.near) || .9) ? "near" : "miss"}">${pct(v)}</span>`;
  const achOf = r => { const c = val(r, C.ach); if (!c) return null; if (typeof c.v === "number") return c.v > 3 ? c.v / 100 : c.v; const n = parseFloat(String(c.f || c.v).replace("%", "")); return isFinite(n) ? n / 100 : null; };
  const rowHtml = r => {
    const uname = disp(val(r, C.crm)).trim(), p = byUser[uname.toLowerCase()];
    const diffN = numv(val(r, C.diff));
    return `<tr><td><span class="tn">${p ? personAv(p, 30) : ""}<span>${p ? esc(p.name) : esc(uname)}<br><small>${esc(uname)}</small></span></span></td>
      <td class="num"><b>${esc(disp(val(r, C.actual)))}</b></td><td class="num">${esc(disp(val(r, C.target)))}</td>
      <td>${achChip(achOf(r))}</td>
      <td class="num" style="font-weight:600;color:${diffN != null && diffN < 0 ? "#D92D20" : "#039855"}">${esc(disp(val(r, C.diff)))}</td>
      <td class="num">${esc(disp(val(r, C.order)))}</td><td class="num">${esc(disp(val(r, C.size)))}</td>
      <td class="num">${esc(disp(val(r, C.calls)))}</td><td class="num">${esc(disp(val(r, C.reached)))}</td><td class="num">${esc(disp(val(r, C.done)))}</td>
      <td class="num">${esc(disp(val(r, C.talk)))}</td><td class="num">${esc(disp(val(r, C.con)))}</td><td class="num">${esc(disp(val(r, C.avg)))}</td></tr>`;
  };
  const thead = `<thead><tr><th>เซลส์</th><th>Actual</th><th>Target</th><th>Achieve%</th><th>Diff</th><th>ออเดอร์</th><th>Size</th><th>โทรออก</th><th>ได้คุย</th><th>คุยจบ</th><th>Talk Time</th><th>Con%</th><th>เฉลี่ย/สาย</th></tr></thead>`;
  const totRow = g => {
    if (!g.total) return "";
    const r = g.total, diffN = numv(val(r, C.diff));
    return `<tr class="total"><td>รวม ${esc(g.name)}</td><td class="num"><b>${esc(disp(val(r, C.actual)))}</b></td><td class="num">${esc(disp(val(r, C.target)))}</td><td>${achChip(achOf(r))}</td>
      <td class="num" style="font-weight:600;color:${diffN != null && diffN < 0 ? "#D92D20" : "#039855"}">${esc(disp(val(r, C.diff)))}</td>
      <td class="num">${esc(disp(val(r, C.order)))}</td><td class="num">${esc(disp(val(r, C.size)))}</td><td class="num">${esc(disp(val(r, C.calls)))}</td><td class="num">${esc(disp(val(r, C.reached)))}</td><td class="num">${esc(disp(val(r, C.done)))}</td><td class="num">${esc(disp(val(r, C.talk)))}</td><td class="num">${esc(disp(val(r, C.con)))}</td><td class="num">${esc(disp(val(r, C.avg)))}</td></tr>`;
  };
  const secs = groups.map(g => `<section class="sec"><div class="sech"><div><h2>${esc(g.name)}</h2><p>${g.rows.length} คน</p></div></div>
    <div class="panel scroll"><table>${thead}<tbody>${g.rows.map(rowHtml).join("")}${totRow(g)}</tbody></table></div></section>`).join("");
  el.innerHTML = `<div class="sumgrid" style="margin-bottom:22px">
      ${tile("💰 Actual รวม", fmt(actAll) + " บ.", "Target " + fmt(tgtAll))}
      ${tile("🎯 Achieve% รวม", tgtAll ? pct(actAll / tgtAll) : "—", "Diff " + fmt(actAll - tgtAll))}
      ${tile("🧾 ออเดอร์รวม", fmt(ordAll), "")}
      ${tile("🙋 Manday รวม", fmt(manAll), "")}
      ${tile("⏱ อัปเดตล่าสุด", new Date(hitState.at).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }), "รีเฟรชเองทุก 1 นาที")}
    </div>` + secs + `<p class="hint"><a href="${esc(src.raw)}" target="_blank" rel="noopener">เปิดชีตต้นทาง</a> · ชื่อเซลส์จับคู่จาก username ให้อัตโนมัติ</p>`;
}

/* ---------- people ---------- */
function pagePeople() {
  const P = periodInfo(), pt = personTargets();
  const list = S.cfg.people.filter(p => (S.peopleTeam === "all" || p.team === S.peopleTeam) && (p.active !== false || agg(P.days, personPred(p.id)).n));
  const rows = list.map(p => {
    const r = perf(pt[p.id] || 0, P.days, personPred(p.id)), a = r.a;
    return { p, r, a, k: { p: r.p ?? -1, sales: r.sales, calls: a.calls ?? -1, rCon: a.rCon ?? -1, rConNew: a.rConNew ?? -1, rConOld: a.rConOld ?? -1, newSales: a.newSales ?? -1, oldSales: a.oldSales ?? -1, talkPer: a.talkPer ?? -1, callsPer: a.callsPer ?? -1, closed: a.closed ?? -1 } };
  });
  const { k, d } = S.sort;
  rows.sort((x, y) => (x.k[k] - y.k[k]) * d);
  const K = S.cfg.kpi;
  const th = (key, label) => `<th class="sort" data-sort="${key}">${label}${k === key ? (d < 0 ? " ▼" : " ▲") : ""}</th>`;
  const body = rows.map((x, i) => {
    const t = teamById(x.p.team) || {}, a = x.a;
    return `<tr><td><span class="tn"><span class="rank">${i + 1}</span>${personAv(x.p, 32)}<span>${esc(x.p.name)}<br><small>${esc(t.name || "")}</small></span></span></td>
      <td class="num">${fmt(x.r.sales)}</td><td class="num">${fmt(x.r.toDate)}</td><td><span class="chip ${x.r.status}">${x.r.p == null ? "รอกรอก" : pct(x.r.p)}</span></td>
      <td class="num">${fmt(a.newSales)}<br><small>${fmt(a.newOrders)} ออเดอร์</small></td><td class="num">${fmt(a.oldSales)}<br><small>${fmt(a.oldOrders)} ออเดอร์</small></td>
      <td class="num">${fmt(a.calls)}</td><td class="num">${fmt(a.reached)}</td><td class="num">${fmt(a.completed)}</td><td class="num">${fmt(a.closed)}</td>
      <td class="num ${kcls(a.rReach, K.rReach)}">${pct(a.rReach)}</td><td class="num ${kcls(a.rCon, K.rCon)}">${pct(a.rCon)}</td><td class="num">${pct(a.rConNew)}</td><td class="num">${pct(a.rConOld)}</td>
      <td class="num">${a.talk == null ? "—" : hm(a.talk)}</td><td class="num ${kcls(a.talkPer, K.talkPerDay)}">${a.talkPer == null ? "—" : hm(a.talkPer)}</td>
      <td class="num ${kcls(a.callsPer, K.callsPerDay)}">${fmt1(a.callsPer)}</td><td class="num">${a.dates.size}</td></tr>`;
  }).join("");
  return `<div class="ph"><div><h1>ผลงานรายคน</h1><p>${esc(P.title)} · กดหัวตารางเพื่อเรียงลำดับ</p></div>
    <div class="chips">${[["all", "ทุกทีม"], ...S.cfg.teams.map(t => [t.id, t.name])].map(([id, n]) => `<button data-pteam="${esc(id)}" aria-pressed="${S.peopleTeam === id}">${esc(n)}</button>`).join("")}</div></div>
    <div class="panel scroll">${rows.length ? `<table><thead><tr><th>เซลส์</th>${th("sales", "ยอดขาย")}<th>เป้าถึงวันนี้</th>${th("p", "% เป้า")}${th("newSales", "ยอดใหม่")}${th("oldSales", "ยอดเก่า")}${th("calls", "โทร")}<th>ได้คุย</th><th>คุยจบ</th>${th("closed", "ออเดอร์")}<th>%ติดต่อได้</th>${th("rCon", "%Con")}${th("rConNew", "%Con<br>ใหม่")}${th("rConOld", "%Con<br>เก่า")}<th>Talktime</th>${th("talkPer", "Talktime<br>/วัน")}${th("callsPer", "โทร<br>/วัน")}<th>วันที่กรอก</th></tr></thead><tbody>${body}</tbody></table>` : '<p class="empty">ยังไม่มีรายชื่อเซลส์ แอดมินเพิ่มได้ที่หน้าตั้งค่า</p>'}</div>
    ${kpiNote()}`;
}
function kcls(v, target) { target = num(target); if (v == null) return "na"; if (!target) return ""; return v >= target ? "up" : v < target * 0.9 ? "down" : ""; }
function kpiNote() {
  const K = S.cfg.kpi, parts = [];
  if (num(K.callsPerDay)) parts.push(`โทร ${fmt(K.callsPerDay)} สาย/วัน`);
  if (num(K.talkPerDay)) parts.push(`Talktime ${hm(K.talkPerDay)} ชม./วัน`);
  if (num(K.rReach)) parts.push(`%ติดต่อได้ ${pct(K.rReach)}`);
  if (num(K.rCon)) parts.push(`%Con ${pct(K.rCon)}`);
  return `<p class="hint" style="margin-top:10px">${parts.length ? "เป้า KPI ต่อคนจากแอดมิน: " + parts.join(", ") + " · สีเขียว = ถึงเป้า, สีชมพู = ต่ำกว่าเป้าเกิน 10%" : "แอดมินยังไม่ได้ตั้งเป้า KPI ต่อคน ตั้งได้ที่หน้าตั้งค่า"}</p>`;
}

    return `<div class="krow"><span class="kl">${label}</span>
      <span class="kbar"><i style="width:${has ? Math.min(100, (p == null ? .6 : p) * 100) : 0}%;background:${col}"></i></span>
      <span class="kv num">${has ? fmtF(v) : "—"}${tgt ? `<small>เป้า ${fmtF(tgt)}</small>` : ""}</span></div>`;

    ${tile("📞 โทรออกรวม", fmt(all.calls), all.callsPer != null ? "เฉลี่ย " + fmt1(all.callsPer) + " สาย/คน/วัน" : "")}
    ${tile("🗣 ได้คุยรวม", fmt(all.reached), perDay(all.reached, all) != null ? "เฉลี่ย " + fmt1(perDay(all.reached, all)) + " /คน/วัน" : "")}
    ${tile("⏱ Talktime รวม", all.talk == null ? "—" : hm(all.talk), all.talkPer != null ? "เฉลี่ย " + hm(all.talkPer) + " /คน/วัน" : "")}
    ${tile("🧾 ออเดอร์รวม", fmt(all.closed), "%Con " + pct(all.rCon))}

        <span class="chip ${r.status}" style="margin-left:auto">${r.p == null ? "รอกรอก" : pct(r.p)}</span></div>
      <div class="kbig num">${fmt(r.sales)} <small>บาท</small></div>
      <div class="ksub">เฉลี่ยต่อคนต่อวัน (เทียบเป้า KPI)</div>
      ${bar(a.callsPer, num(K.callsPerDay), v => fmt1(v) + " สาย", "📞 โทร")}
      ${bar(reachPer, null, v => fmt1(v) + " คน", "🗣 ได้คุย")}
      ${bar(a.talkPer, num(K.talkPerDay), v => hm(v), "⏱ Talktime")}
      ${bar(salesPer, null, v => fmt(v) + " บ.", "💰 ยอดขาย")}
      <div class="krow"><span class="kl">🎯 %Con</span><span class="kbar"><i style="width:${a.rCon != null ? Math.min(100, a.rCon / (num(K.rCon) || 1) * 100) : 0}%;background:${a.rCon == null ? "var(--brand)" : num(K.rCon) && a.rCon >= num(K.rCon) ? "#12B76A" : "#F04438"}"></i></span><span class="kv num">${pct(a.rCon)}${num(K.rCon) ? `<small>เป้า ${pct(num(K.rCon))}</small>` : ""}</span></div>
    </div>`;

    const r = perf(m, P.days, pred), a = r.a;

      <td class="num">${fmt(a.newSales)}<br><small>${fmt(a.newOrders)} ออเดอร์</small></td><td class="num">${fmt(a.oldSales)}<br><small>${fmt(a.oldOrders)} ออเดอร์</small></td>

    ${tiles}
    <div class="kpigrid">${cards}</div>
    <details class="kdetails"><summary>ตารางตัวเลขละเอียดทุกคอลัมน์</summary>
    <div class="panel scroll" style="margin-top:12px"><table><thead><tr><th>ทีม</th><th>ยอดขาย</th><th>% เป้า</th><th>ยอดใหม่</th><th>ยอดเก่า</th><th>โทร</th><th>ได้คุย</th><th>คุยจบ</th><th>ออเดอร์</th><th>%ติดต่อได้</th><th>%คุยจบ</th><th>%Con</th><th>%Con ใหม่</th><th>%Con เก่า</th><th>Talktime</th><th>Talktime<br>/คน/วัน</th><th>โทร<br>/คน/วัน</th><th>ยอดเฉลี่ย<br>/ออเดอร์</th><th>ลูกค้าใหม่</th></tr></thead><tbody>${body}</tbody></table></div></details>
    ${kpiNote()}

}

  const list = Object.values(S.notes).filter(n => wset.has(n.week));

          : `<div class="acts"><button class="btn ghost sm" data-reply="${esc(k)}">${rp ? "แก้คำตอบ" : "+ ตอบกลับ"}</button></div>`;
      }
      if (f === "plan") {
        const ak = `${n.week}__${n.team}`, ap = S.cfg.approvals[ak];
        if (ap) extra += `<div><span class="okbadge">✓ หัวหน้าอนุมัติแผนแล้ว${ap.at ? ` · ${esc(dShort(ap.at))}` : ""}</span></div>`;
        if (admin) extra += `<div class="acts">${ap ? `<button class="btn ghost sm" data-unapprove="${esc(ak)}">ยกเลิกการอนุมัติ</button>` : `<button class="btn primary sm" data-approve="${esc(ak)}">✓ อนุมัติแผนสัปดาห์หน้า</button>`}</div>`;
      }
      return `<div class="note">${teamAv(t, 34)}<div style="flex:1"><b>${esc(t.name)}</b> <small>${esc(n.week)}${n.updatedBy ? " · " + esc(n.updatedBy) : ""}</small><p>${esc(n[f])}</p>${extra}</div></div>`;
    }).join("");
    return `<div class="panel col"><h3><i style="background:${c}"></i>${h}</h3>${items || '<p class="empty" style="padding:0">ยังไม่มีข้อความในช่วงนี้</p>'}</div>`;
  }).join("");
  return `<div class="ph"><div><h1>เสียงจากซุป</h1><p>${esc(P.title)} · ซุปเขียนได้ที่หน้ากรอกผลรายวัน</p></div></div><div class="voices" style="grid-template-columns:repeat(2,minmax(0,1fr))">${html}</div>`;
}

function adminMark() { S.adminDirty = true; const m = $("aMsg"); if (m) { m.textContent = "มีการแก้ไขที่ยังไม่บันทึก"; m.classList.add("dirty"); } }
function readAdminInputs() {
  const D = S.draft, errs = [];
  document.querySelectorAll("[data-t]").forEach(i => {
    const t = D.teams[+i.dataset.t]; if (!t) return;
    if (i.dataset.f === "target") { const v = parseNum(i.value); if (Number.isNaN(v)) errs.push(i); else t.target = v; }
    else t[i.dataset.f] = i.value.trim();
  });
  document.querySelectorAll("[data-pi]").forEach(i => {
    const p = D.people[+i.dataset.pi]; if (!p) return;
    if (i.dataset.f === "target") { const v = parseNum(i.value); if (Number.isNaN(v)) errs.push(i); else p.target = v; }
    else if (i.dataset.f === "active") p.active = i.checked;
    else p[i.dataset.f] = i.type === "checkbox" ? i.checked : i.value.trim();
  });
  document.querySelectorAll("[data-k]").forEach(i => {
    if (i.dataset.k === "brand") D.brand = i.value;
    else if (i.dataset.k === "pbiUrl") D.pbi = { url: i.value.trim() };
    else if (i.dataset.k === "hitUrl") D.hitboard = { url: i.value.trim() };
    else { const v = parseNum(i.value); if (Number.isNaN(v) || v === null) errs.push(i); else D[i.dataset.k] = v / 100; }
  });
  document.querySelectorAll("[data-kpi]").forEach(i => {
    const k = i.dataset.kpi;
    const v = k === "talkPerDay" ? parseTalk(i.value) : parseNum(i.value);
    if (Number.isNaN(v)) { errs.push(i); return; }
    D.kpi[k] = v == null ? null : (k === "rReach" || k === "rCon") ? v / 100 : v;
  });
  document.querySelectorAll("[data-prob]").forEach(i => {
    const v = parseNum(i.value); if (Number.isNaN(v) || v === null) { errs.push(i); return; }
    D.prob = D.prob || {}; D.prob[i.dataset.prob] = v;
  });
  document.querySelectorAll("[data-ti]").forEach(i => {
    const t = ((D.inc || {}).tiers || [])[+i.dataset.ti]; if (!t) return;
    const v = parseNum(i.value); if (Number.isNaN(v)) errs.push(i); else t[i.dataset.tf === "min" ? 0 : 1] = v || 0;

let photoTarget = null;
function resizeImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error("type"));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const Z = 200, c = document.createElement("canvas"); c.width = c.height = Z;
      const s = Math.min(img.width, img.height), x = (img.width - s) / 2, y = (img.height - s) / 2;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, Z, Z);
      ctx.drawImage(img, x, y, s, s, 0, 0, Z, Z); URL.revokeObjectURL(url);
      let q = .8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 45000 && q > .3) { q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src = url;
  });
}

  if (x.closest("#addPerson")) { readAdminInputs(); if (!S.draft.teams.length) { toast("เพิ่มทีมก่อน"); return; } S.draft.people.push({ id: uid("p"), name: "", team: S.draft.teams[0].id, target: null, active: true }); adminMark(); render(); const ins = document.querySelectorAll('[data-pi][data-f="name"]'); ins[ins.length - 1]?.focus(); return; }
  const dt = x.closest("[data-deltam]");
  if (dt) { readAdminInputs(); const t = S.draft.teams[+dt.dataset.deltam]; const n = S.draft.people.filter(p => p.team === t.id).length;
    if (!confirm(`ลบทีม ${t.name}?${n ? ` เซลส์ ${n} คนในทีมนี้จะถูกลบด้วย` : ""} (ยอดที่กรอกไปแล้วยังอยู่ใน Google Sheet)`)) return;
    S.draft.teams.splice(+dt.dataset.deltam, 1); S.draft.people = S.draft.people.filter(p => p.team !== t.id); adminMark(); render(); return; }
  const dp = x.closest("[data-delp]");
  if (dp) { readAdminInputs(); const p = S.draft.people[+dp.dataset.delp]; if (!confirm(`ลบ ${p.name || "เซลส์คนนี้"}? ถ้าแค่ลาออกกลางเดือน แนะนำให้เอาติ๊ก "ทำงานอยู่" ออกแทน เพื่อให้ยอดที่ทำไว้ยังนับ`)) return; S.draft.people.splice(+dp.dataset.delp, 1); adminMark(); render(); return; }
  if (x.closest("#holAdd")) { const v = $("holIn").value; if (!v || !v.startsWith(S.month)) { toast("เลือกวันที่ในเดือนนี้"); return; } readAdminInputs(); if (!S.draft.holidays.includes(v)) S.draft.holidays.push(v); adminMark(); render(); return; }
  const dh = x.closest("[data-delhol]"); if (dh) { readAdminInputs(); S.draft.holidays = S.draft.holidays.filter(h => h !== dh.dataset.delhol); adminMark(); render(); return; }
  if (x.closest("#aSave")) { saveAdmin(); return; }
  if (x.closest("#aReset")) { if (S.adminDirty && !confirm("ยกเลิกการแก้ไขทั้งหมด?")) return; S.draft = null; S.adminDirty = false; render(); return; }
  if (x.closest("#newMonthBtn")) { createMonth(); return; }
  if (x.closest("#planImport")) { importPlan(); return; }
  if (x.closest("#evAdd")) { const d = $("evDate").value, ti = $("evTitle").value.trim(); if (!d || !ti) { toast("ใส่วันที่และเรื่องก่อน"); return; } readAdminInputs(); (S.draft.events = S.draft.events || []).push({ id: uid("e"), d, t: ti, o: $("evOwner").value.trim() }); adminMark(); render(); return; }
  const de = x.closest("[data-delev]"); if (de) { readAdminInputs(); S.draft.events = (S.draft.events || []).filter(ev => ev.id !== de.dataset.delev); adminMark(); render(); return; }
  if (x.closest("#addTier")) { readAdminInputs(); S.draft.inc = S.draft.inc || { first: 500, tiers: [] }; S.draft.inc.tiers.push([0, 0]); adminMark(); render(); return; }
  const dti = x.closest("[data-delti]"); if (dti) { readAdminInputs(); S.draft.inc.tiers.splice(+dti.dataset.delti, 1); adminMark(); render(); return; }
  if (x.closest("#csvBtn")) { downloadCsv(); return; }
});
page.addEventListener("input", e => {
  if (e.target.matches(".ein")) { S.dirty = true; const m = $("saveMsg"); if (m) { m.textContent = "มีการแก้ไขที่ยังไม่บันทึก"; m.classList.add("dirty"); } entryCalc(); }
  else if (e.target.matches("[data-note]")) { S.dirty = true; const m = $("saveMsg"); if (m) { m.textContent = "มีการแก้ไขที่ยังไม่บันทึก"; m.classList.add("dirty"); } }
  else if (S.page === "admin" && e.target.closest(".main")) { adminMark(); if (e.target.id === "aBrand") document.documentElement.style.setProperty("--brand", e.target.value); }
});
page.addEventListener("change", e => { if (S.page === "admin" && (e.target.matches("[data-wd]") || (e.target.matches("select[data-pi]")))) { readAdminInputs(); adminMark(); render(); } });
page.addEventListener("focusout", e => {
  const i = e.target;
  if (i.matches(".ein")) {
    const v = i.dataset.f === "talk" ? parseTalk(i.value) : parseNum(i.value);
    if (typeof v === "number" && !isNaN(v)) i.value = i.dataset.f === "talk" ? hm(v) : v.toLocaleString("th-TH");
  }
  if (i.matches('[data-f="target"]')) { const v = parseNum(i.value); if (typeof v === "number" && !isNaN(v)) i.value = v.toLocaleString("th-TH"); }
});
// Enter ในตารางกรอกผล = ไปช่องถัดลงไป
page.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches(".ein")) return;
  e.preventDefault();
  const f = e.target.dataset.f, all = [...document.querySelectorAll(`.ein[data-f="${f}"]`)], i = all.indexOf(e.target);
  (all[i + 1] || document.getElementById("saveEntry")).focus();
});
window.addEventListener("beforeunload", e => { if (S.dirty || S.adminDirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && API) load(S.month, true); });

/* ============ start ============ */
(function start() {
  const m = bootMonth();
  if (!API) { setSync("local"); load(""); return; }
  setSync("connecting");
  if (!code) { S.month = m; askCode(""); } else load("");
  setInterval(() => { if (!document.hidden && code) load(S.month, true); }, POLL_MS);
})();
</script>
</body>
</html>
